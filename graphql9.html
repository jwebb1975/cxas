<!DOCTYPE html>

  <style>
    body {

      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    /* Top banner */
    .banner {
      background-color: #1a1a1a;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 50px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .banner h1 {
      font-size: 18px;
      margin: 0;
    }

    /* Button styling */
    .banner button {
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
    }

    .banner button:hover {
      background-color: #005fa3;
    }

    /* Iframe takes up remaining height */
    iframe {
      border: none;
      flex: 1;
      width: 100%;
    }
  </style>
</head>
