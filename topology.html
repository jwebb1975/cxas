<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Topology Map Viewer</title>
  <style>
    :root{
      --bg:#070A12;
      --note:#F6F0B8;
      --noteBorder:#B9B07A;
      --ink:#222;
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --accent:#35F3FF;
      --accent2:#B56BFF;
      --muted:#A8B3D6;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    body{
      margin:0;
      font-family:var(--sans);
      color:#E7EEFF;
      background:
        radial-gradient(900px 600px at 10% 10%, rgba(53,243,255,.12), transparent 55%),
        radial-gradient(900px 600px at 90% 20%, rgba(181,107,255,.12), transparent 55%),
        linear-gradient(180deg, #050712, #070A12);
      min-height:100vh;
    }
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
      background: rgba(7,10,18,.70);
      border-bottom: 1px solid rgba(53,243,255,.18);
    }
    .wrap{ max-width:1200px; margin:0 auto; padding:14px 16px; }
    .top{
      display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    }
    .title{ font-weight:900; letter-spacing:.3px; }
    .meta{ color:var(--muted); font-family:var(--mono); font-size:12px; }
    .btn{
      cursor:pointer;
      border:1px solid rgba(53,243,255,.35);
      background: linear-gradient(180deg, rgba(53,243,255,.18), rgba(14,20,48,.55));
      color:#E7EEFF;
      padding:10px 12px;
      border-radius:12px;
      font-weight:800;
      letter-spacing:.2px;
    }
    .btn:hover{ box-shadow: 0 0 0 3px rgba(53,243,255,.12); }

    .stage{
      max-width:1200px;
      margin: 16px auto 28px;
      padding: 0 16px;
    }
    .frame{
      position:relative;
      border:1px solid rgba(53,243,255,.18);
      border-radius:16px;
      overflow:hidden;
      box-shadow: var(--shadow);
      background: rgba(14,20,48,.35);
    }
    img.diagram{
      display:block;
      width:100%;
      height:auto;
      user-select:none;
      -webkit-user-drag:none;
    }
    svg.overlay{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }

    .note{
      background: var(--note);
      border: 2px solid var(--noteBorder);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--ink);
      font-family: var(--sans);
      box-sizing: border-box;
    }
    .note h3{
      margin:0 0 6px;
      font-size:14px;
      text-decoration: underline;
      font-weight: 900;
      letter-spacing:.2px;
    }
    .note .line{
      font-size:13px;
      line-height:1.25;
      margin: 2px 0;
    }
    .note .k{ font-weight: 800; }
    .note .v{
      font-family: var(--mono);
      font-size: 12px;
      background: rgba(0,0,0,.06);
      padding: 1px 6px;
      border-radius: 999px;
      display:inline-block;
      word-break: break-word;
    }

    .statusBar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      margin: 10px 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size:12px;
    }
    .pill{
      border:1px solid rgba(53,243,255,.20);
      background: rgba(14,20,48,.45);
      padding: 8px 10px;
      border-radius: 999px;
    }
    .pill input{
      width: 220px;
      margin-left:8px;
      padding:6px 8px;
      border-radius: 10px;
      border:1px solid rgba(53,243,255,.20);
      background: rgba(7,10,18,.35);
      color:#E7EEFF;
      font-family: var(--mono);
      font-size:12px;
      outline:none;
    }
    .pill input:focus{ box-shadow: 0 0 0 3px rgba(53,243,255,.12); border-color: rgba(53,243,255,.35); }
    .small{ font-size:11px; opacity:.9; }
    a { color: rgba(53,243,255,.95); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="title">Network Topology Map (Template + Customer Overlay)</div>
        <div class="meta" id="meta">Loading…</div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn" id="refreshBtn">Refresh</button>
      </div>
    </div>
  </div>
</header>

<main class="stage">
  <div class="frame" id="frame">
    <img class="diagram" id="diagram" alt="Topology Diagram" src="" />
    <svg class="overlay" id="overlay" preserveAspectRatio="none"></svg>
  </div>

  <div class="statusBar">
    <div class="pill">Data source: <span id="source">MockAPI</span></div>
    <div class="pill">Record: <span id="recordId">—</span></div>
    <div class="pill">Updated: <span id="updatedAt">—</span></div>

    <!-- NEW: pick a specific customer/project by query string or input -->
    <div class="pill">
      Customer (optional)
      <input id="customerFilter" placeholder="e.g., Equity Bank" />
    </div>
    <div class="pill small">
      Tip: You can also use <span class="v">?customer=Equity%20Bank</span>
    </div>
  </div>
</main>

<script>
  /************** CONFIG **************/
  // Your MockAPI endpoint (resource already included)
  const MOCKAPI_COLLECTION_URL = "https://659f21365023b02bfe894b27.mockapi.io/cx/Topology";

  // Your GitHub repo images folder (raw content)
  // Put files in: cxas/images/
  const GITHUB_IMAGES_BASE =
    "https://raw.githubusercontent.com/jwebb1975/cxas/main/images/";

  // Template image name stored in /images
  const TEMPLATE_IMAGE = "topology.png";

  // If customer-specific image doesn't exist, we fall back to TEMPLATE_IMAGE
  function customerToImageName(customerName) {
    if (!customerName) return TEMPLATE_IMAGE;

    // slugify
    const slug = String(customerName)
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/(^-|-$)/g, "");

    return `${slug}-topology.png`;
  }

  // Query string helper
  function qs(name) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name);
  }

  // Fetch records, optionally filter by customerName
  async function fetchRecord(customerName) {
    // MockAPI supports typical query params but filtering can vary.
    // Robust approach: fetch a reasonable set, then filter client-side.
    const res = await fetch(`${MOCKAPI_COLLECTION_URL}?sortBy=updatedAt&order=desc`);
    if (!res.ok) throw new Error(`MockAPI error ${res.status}`);
    const all = await res.json();

    if (!Array.isArray(all) || !all.length) throw new Error("No records found in MockAPI.");

    if (!customerName) return all[0];

    const lower = customerName.toLowerCase().trim();
    const match = all.find(r => String(r.customerName || "").toLowerCase().trim() === lower);

    // If exact match not found, fallback to latest
    return match || all[0];
  }

  /************** SVG helpers **************/
  function clearOverlay(svg) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
  }

  function addNote(svg, x, y, w, h, innerHtml) {
    const fo = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
    fo.setAttribute("x", x);
    fo.setAttribute("y", y);
    fo.setAttribute("width", w);
    fo.setAttribute("height", h);

    const div = document.createElement("div");
    div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    div.className = "note";
    div.innerHTML = innerHtml;

    fo.appendChild(div);
    svg.appendChild(fo);
  }

  function get(obj, path, fallback="Not Provided") {
    try {
      return path.split(".").reduce((o,k)=> (o && o[k] !== undefined ? o[k] : undefined), obj) ?? fallback;
    } catch {
      return fallback;
    }
  }

  /************** Render **************/
  async function render() {
    const meta = document.getElementById("meta");
    meta.textContent = "Loading from MockAPI…";

    const customerFromUrl = qs("customer");
    const customerFromInput = document.getElementById("customerFilter").value.trim();
    const customerName = customerFromInput || customerFromUrl || "";

    const record = await fetchRecord(customerName);

    // Display status
    document.getElementById("recordId").textContent = record?.id ?? "—";
    document.getElementById("updatedAt").textContent = record?.updatedAt ?? "—";

    const effectiveCustomer = record?.customerName || customerName || "Latest record";
    meta.innerHTML = `Rendering: <b>${escapeHtml(effectiveCustomer)}</b> &nbsp;·&nbsp; <span class="small">Image auto-selects from /images (falls back to template)</span>`;

    // Choose image file: customer-specific copy or template
    const imageFile = customerToImageName(record?.customerName || customerName);
    const diagram = document.getElementById("diagram");

    // Try customer image first
    diagram.src = GITHUB_IMAGES_BASE + imageFile;

    // If not found, fallback to template
    diagram.onerror = () => {
      diagram.onerror = null;
      diagram.src = GITHUB_IMAGES_BASE + TEMPLATE_IMAGE;
    };

    // Wait for image to load to get natural dimensions
    await new Promise((resolve, reject) => {
      if (diagram.complete && diagram.naturalWidth) return resolve();
      diagram.onload = resolve;
      diagram.onerror = () => reject(new Error("Diagram image failed to load (template missing?)."));
    });

    const svg = document.getElementById("overlay");
    svg.setAttribute("viewBox", `0 0 ${diagram.naturalWidth} ${diagram.naturalHeight}`);
    clearOverlay(svg);

    // === NOTES (same boxes as before) ===
    addNote(svg, 30, 25, 300, 115, `
      <h3>Calling Type</h3>
      <div class="line"><span class="k">CCP / CCP / LGW:</span> <span class="v">${escapeHtml(get(record,"callingType"))}</span></div>
      <div class="line"><span class="k">Porting:</span> <span class="v">${escapeHtml(get(record,"porting"))}</span></div>
    `);

    addNote(svg, 600, 20, 460, 170, `
      <h3>Project Scope</h3>
      <div class="line"><span class="k">CUBE:</span> <span class="v">${escapeHtml(get(record,"projectScope.cube"))}</span></div>
      <div class="line"><span class="k">IT Vendor:</span> <span class="v">${escapeHtml(get(record,"projectScope.itVendor"))}</span></div>
      <div class="line"><span class="k">Firewall:</span> <span class="v">${escapeHtml(get(record,"projectScope.firewallModel"))}</span></div>
    `);

    addNote(svg, 1260, 25, 360, 210, `
      <h3>Transport Network</h3>
      <div class="line"><span class="k">Provider Name:</span> <span class="v">${escapeHtml(get(record,"transportNetwork.providerName"))}</span></div>
      <div class="line"><span class="k">SIP CCS:</span> <span class="v">${escapeHtml(get(record,"transportNetwork.sipCcs"))}</span></div>
      <div class="line"><span class="k">PRI Qty:</span> <span class="v">${escapeHtml(get(record,"transportNetwork.priQty"))}</span></div>
      <div class="line"><span class="k">DID Qty:</span> <span class="v">${escapeHtml(get(record,"transportNetwork.didQty"))}</span></div>
    `);

    addNote(svg, 40, 880, 520, 250, `
      <h3>Contact Center Integrations</h3>
      <div class="line"><span class="k">CRM:</span> <span class="v">${escapeHtml(get(record,"ccIntegrations.crm"))}</span></div>
      <div class="line"><span class="k">REST API:</span> <span class="v">${escapeHtml(get(record,"ccIntegrations.restApi"))}</span></div>
      <div class="line"><span class="k">TTS:</span> <span class="v">${escapeHtml(get(record,"ccIntegrations.tts"))}</span></div>
      <div class="line"><span class="k">WFO:</span> <span class="v">${escapeHtml(get(record,"ccIntegrations.wfo"))}</span></div>
      <div class="line"><span class="k">Call Recording:</span> <span class="v">${escapeHtml(get(record,"ccIntegrations.callRecording"))}</span></div>
      <div class="line"><span class="k">Reporting/Dashboards:</span> <span class="v">${escapeHtml(get(record,"ccIntegrations.reportingDashboards"))}</span></div>
    `);
  }

  // Basic HTML escape (prevents breaking the overlay if values contain < > etc.)
  function escapeHtml(str){
    return String(str ?? "").replace(/[&<>"']/g, (m)=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  // UI: refresh button
  document.getElementById("refreshBtn").addEventListener("click", ()=>{
    render().catch(err=>{
      document.getElementById("meta").textContent = `Error: ${err.message}`;
      console.error(err);
    });
  });

  // UI: re-render when customer filter changes (debounced)
  let t=null;
  document.getElementById("customerFilter").addEventListener("input", ()=>{
    clearTimeout(t);
    t = setTimeout(()=> {
      render().catch(err=>{
        document.getElementById("meta").textContent = `Error: ${err.message}`;
        console.error(err);
      });
    }, 400);
  });

  // initial: set input from query string if provided
  const c = qs("customer");
  if (c) document.getElementById("customerFilter").value = c;

  render().catch(err=>{
    document.getElementById("meta").textContent = `Error: ${err.message}`;
    console.error(err);
  });
</script>
</body>
</html>
