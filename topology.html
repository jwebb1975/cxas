<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Topology Map Viewer</title>
  <style>
    :root{
      --bg:#070A12;
      --note:#F6F0B8;
      --noteBorder:#B9B07A;
      --ink:#222;
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --accent:#35F3FF;
      --accent2:#B56BFF;
      --muted:#A8B3D6;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    body{
      margin:0;
      font-family:var(--sans);
      color:#E7EEFF;
      background:
        radial-gradient(900px 600px at 10% 10%, rgba(53,243,255,.12), transparent 55%),
        radial-gradient(900px 600px at 90% 20%, rgba(181,107,255,.12), transparent 55%),
        linear-gradient(180deg, #050712, #070A12);
      min-height:100vh;
    }
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
      background: rgba(7,10,18,.70);
      border-bottom: 1px solid rgba(53,243,255,.18);
    }
    .wrap{ max-width:1200px; margin:0 auto; padding:14px 16px; }
    .top{
      display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    }
    .title{
      font-weight:900; letter-spacing:.3px;
    }
    .meta{
      color:var(--muted); font-family:var(--mono); font-size:12px;
    }
    .btn{
      cursor:pointer;
      border:1px solid rgba(53,243,255,.35);
      background: linear-gradient(180deg, rgba(53,243,255,.18), rgba(14,20,48,.55));
      color:#E7EEFF;
      padding:10px 12px;
      border-radius:12px;
      font-weight:800;
      letter-spacing:.2px;
    }
    .btn:hover{ box-shadow: 0 0 0 3px rgba(53,243,255,.12); }

    /* Main stage */
    .stage{
      max-width:1200px;
      margin: 16px auto 28px;
      padding: 0 16px;
    }
    .frame{
      position:relative;
      border:1px solid rgba(53,243,255,.18);
      border-radius:16px;
      overflow:hidden;
      box-shadow: var(--shadow);
      background: rgba(14,20,48,.35);
    }
    img.diagram{
      display:block;
      width:100%;
      height:auto;
      user-select:none;
      -webkit-user-drag:none;
    }

    /* SVG overlay is absolute on top of the image */
    svg.overlay{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none; /* overlay is display-only */
    }

    /* Note styling inside SVG (via <foreignObject> HTML) */
    .note{
      background: var(--note);
      border: 2px solid var(--noteBorder);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--ink);
      font-family: var(--sans);
      box-sizing: border-box;
    }
    .note h3{
      margin:0 0 6px;
      font-size:14px;
      text-decoration: underline;
      font-weight: 900;
      letter-spacing:.2px;
    }
    .note .line{
      font-size:13px;
      line-height:1.25;
      margin: 2px 0;
    }
    .note .k{
      font-weight: 800;
    }
    .note .v{
      font-family: var(--mono);
      font-size: 12px;
      background: rgba(0,0,0,.06);
      padding: 1px 6px;
      border-radius: 999px;
      display:inline-block;
    }

    .statusBar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      margin: 10px 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size:12px;
    }
    .pill{
      border:1px solid rgba(53,243,255,.20);
      background: rgba(14,20,48,.45);
      padding: 8px 10px;
      border-radius: 999px;
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="title">Network Topology Map (Auto-Populated)</div>
        <div class="meta" id="meta">Loading…</div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn" id="refreshBtn">Refresh</button>
      </div>
    </div>
  </div>
</header>

<main class="stage">
  <div class="frame" id="frame">
    <!-- Background diagram image -->
    <img class="diagram" id="diagram" alt="Topology Diagram" src="" />

    <!-- SVG overlay: viewBox must match the “design coordinate system”
         We’ll use the image’s natural width/height once loaded. -->
    <svg class="overlay" id="overlay" preserveAspectRatio="none"></svg>
  </div>

  <div class="statusBar">
    <div class="pill">Data source: <span id="source">MockAPI</span></div>
    <div class="pill">Record: <span id="recordId">—</span></div>
    <div class="pill">Updated: <span id="updatedAt">—</span></div>
  </div>
</main>

<script>
  /************** CONFIG **************/
  const MOCKAPI_BASE_URL = "https://659f21365023b02bfe894b27.mockapi.io/cx/Topology"; // <-- change
  const RESOURCE = "topology"; // <-- your MockAPI resource
  const DIAGRAM_IMAGE_URL = "topology.Png"; // <-- change

  // Which record should render?
  // Option A: latest record by updatedAt (fallback: last item)
  async function fetchLatestRecord() {
    const url = `${MOCKAPI_BASE_URL}/${RESOURCE}?sortBy=updatedAt&order=desc&limit=1`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`MockAPI error ${res.status}`);
    const arr = await res.json();
    if (Array.isArray(arr) && arr.length) return arr[0];

    // fallback (if updatedAt not in your data)
    const res2 = await fetch(`${MOCKAPI_BASE_URL}/${RESOURCE}`);
    if (!res2.ok) throw new Error(`MockAPI error ${res2.status}`);
    const all = await res2.json();
    return all[all.length - 1];
  }

  /************** SVG helpers **************/
  function clearOverlay(svg) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
  }

  // Create a sticky-note box using <foreignObject> so we can style with HTML/CSS
  function addNote(svg, x, y, w, h, innerHtml) {
    const fo = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
    fo.setAttribute("x", x);
    fo.setAttribute("y", y);
    fo.setAttribute("width", w);
    fo.setAttribute("height", h);

    const div = document.createElement("div");
    div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    div.className = "note";
    div.innerHTML = innerHtml;

    fo.appendChild(div);
    svg.appendChild(fo);
  }

  // Safely read nested values
  function get(obj, path, fallback="Not Provided") {
    try {
      return path.split(".").reduce((o,k)=> (o && o[k] !== undefined ? o[k] : undefined), obj) ?? fallback;
    } catch {
      return fallback;
    }
  }

  /************** Render **************/
  async function render() {
    const meta = document.getElementById("meta");
    meta.textContent = "Loading from MockAPI…";

    const record = await fetchLatestRecord();

    document.getElementById("recordId").textContent = record?.id ?? "—";
    document.getElementById("updatedAt").textContent = record?.updatedAt ?? "—";
    meta.textContent = `Rendering fields for record id=${record?.id ?? "?"}`;

    const diagram = document.getElementById("diagram");
    diagram.src = DIAGRAM_IMAGE_URL;

    // Wait for image to know natural size => set overlay viewBox
    await new Promise((resolve, reject) => {
      if (diagram.complete && diagram.naturalWidth) return resolve();
      diagram.onload = resolve;
      diagram.onerror = () => reject(new Error("Diagram image failed to load"));
    });

    const svg = document.getElementById("overlay");
    svg.setAttribute("viewBox", `0 0 ${diagram.naturalWidth} ${diagram.naturalHeight}`);
    clearOverlay(svg);

    /**
     * IMPORTANT:
     * The x/y/w/h below are tuned to your diagram layout.
     * If you swap images or crop, you’ll adjust these coordinates.
     */

    // Top-left: Calling Type
    addNote(svg, 30, 25, 300, 115, `
      <h3>Calling Type</h3>
      <div class="line"><span class="k">CCP / CCP / LGW:</span> <span class="v">${get(record,"callingType")}</span></div>
      <div class="line"><span class="k">Porting:</span> <span class="v">${get(record,"porting")}</span></div>
    `);

    // Top-center: Project Scope
    addNote(svg, 600, 20, 460, 170, `
      <h3>Project Scope</h3>
      <div class="line"><span class="k">CUBE:</span> <span class="v">${get(record,"projectScope.cube")}</span></div>
      <div class="line"><span class="k">IT Vendor:</span> <span class="v">${get(record,"projectScope.itVendor")}</span></div>
      <div class="line"><span class="k">Firewall:</span> <span class="v">${get(record,"projectScope.firewallModel")}</span></div>
    `);

    // Top-right: Transport Network
    addNote(svg, 1260, 25, 360, 210, `
      <h3>Transport Network</h3>
      <div class="line"><span class="k">Provider Name:</span> <span class="v">${get(record,"transportNetwork.providerName")}</span></div>
      <div class="line"><span class="k">SIP CCS:</span> <span class="v">${get(record,"transportNetwork.sipCcs")}</span></div>
      <div class="line"><span class="k">PRI Qty:</span> <span class="v">${get(record,"transportNetwork.priQty")}</span></div>
      <div class="line"><span class="k">DID Qty:</span> <span class="v">${get(record,"transportNetwork.didQty")}</span></div>
    `);

    // Bottom-left: Contact Center Integrations
    addNote(svg, 40, 880, 520, 250, `
      <h3>Contact Center Integrations</h3>
      <div class="line"><span class="k">CRM:</span> <span class="v">${get(record,"ccIntegrations.crm")}</span></div>
      <div class="line"><span class="k">REST API:</span> <span class="v">${get(record,"ccIntegrations.restApi")}</span></div>
      <div class="line"><span class="k">TTS:</span> <span class="v">${get(record,"ccIntegrations.tts")}</span></div>
      <div class="line"><span class="k">WFO:</span> <span class="v">${get(record,"ccIntegrations.wfo")}</span></div>
      <div class="line"><span class="k">Call Recording:</span> <span class="v">${get(record,"ccIntegrations.callRecording")}</span></div>
      <div class="line"><span class="k">Reporting/Dashboards:</span> <span class="v">${get(record,"ccIntegrations.reportingDashboards")}</span></div>
    `);
  }

  document.getElementById("refreshBtn").addEventListener("click", ()=>{
    render().catch(err=>{
      document.getElementById("meta").textContent = `Error: ${err.message}`;
      console.error(err);
    });
  });

  // initial
  render().catch(err=>{
    document.getElementById("meta").textContent = `Error: ${err.message}`;
    console.error(err);
  });
</script>
</body>
</html>
