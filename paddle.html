<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MightyPaddle – River Run</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #0b3c5d;
    font-family: Arial, sans-serif;
  }
  canvas {
    display: block;
    margin: auto;
  }
  .hud {
    position: fixed;
    top: 12px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 16px;
    z-index: 10;
  }
</style>
</head>

<body>

<div class="hud">
  Distance: <span id="score">0</span> m
</div>

<canvas id="game" width="360" height="640"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let boardX = canvas.width / 2;
let boardY = canvas.height * 0.72;
let speed = 3;
let baseSpeed = 3;
let score = 0;
let gameOver = false;

let rocks = [];
let mirrors = [];
let boostTimer = 0;

// ------------------- SPAWNERS -------------------
function spawnRock() {
  rocks.push({
    x: Math.random() * 260 + 50,
    y: -40,
    r: Math.random() * 14 + 18
  });
}

function spawnMirror() {
  mirrors.push({
    x: Math.random() * 260 + 50,
    y: -40,
    size: 22
  });
}

// ------------------- DRAWING -------------------
function drawRiver() {
  const grd = ctx.createLinearGradient(0,0,0,canvas.height);
  grd.addColorStop(0, "#3fa9f5");
  grd.addColorStop(1, "#005f8f");
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // river banks
  ctx.fillStyle = "#2e7d32";
  ctx.fillRect(0,0,40,canvas.height);
  ctx.fillRect(canvas.width-40,0,40,canvas.height);
}

function drawBoard() {
  ctx.save();
  ctx.translate(boardX, boardY);

  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath();
  ctx.ellipse(0, 40, 14, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // board body
  ctx.fillStyle = boostTimer > 0 ? "#ffe066" : "#f5f5f5";
  ctx.beginPath();
  ctx.moveTo(0, -50);
  ctx.quadraticCurveTo(22, 0, 14, 60);
  ctx.lineTo(-14, 60);
  ctx.quadraticCurveTo(-22, 0, 0, -50);
  ctx.fill();

  // center stripe
  ctx.strokeStyle = "#1e88e5";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -45);
  ctx.lineTo(0, 55);
  ctx.stroke();

  // fin
  ctx.fillStyle = "#333";
  ctx.beginPath();
  ctx.moveTo(0, 60);
  ctx.lineTo(6, 72);
  ctx.lineTo(-6, 72);
  ctx.fill();

  ctx.restore();
}

function drawRocks() {
  ctx.fillStyle = "#555";
  rocks.forEach(r => {
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawMirrors() {
  mirrors.forEach(m => {
    ctx.fillStyle = "#cfd8dc";
    ctx.fillRect(m.x - 10, m.y - 10, 20, 20);
    ctx.strokeStyle = "#ffffff";
    ctx.strokeRect(m.x - 10, m.y - 10, 20, 20);
  });
}

// ------------------- UPDATE -------------------
function updateObjects() {
  rocks.forEach(r => r.y += speed);
  mirrors.forEach(m => m.y += speed);

  rocks = rocks.filter(r => r.y < canvas.height + 50);
  mirrors = mirrors.filter(m => m.y < canvas.height + 50);
}

function checkCollisions() {
  rocks.forEach(r => {
    const dx = r.x - boardX;
    const dy = r.y - boardY;
    if (Math.abs(dx) < r.r && Math.abs(dy) < r.r) {
      gameOver = true;
    }
  });

  mirrors.forEach((m, i) => {
    const dx = m.x - boardX;
    const dy = m.y - boardY;
    if (Math.abs(dx) < 25 && Math.abs(dy) < 40) {
      boostTimer = 180;
      speed = baseSpeed + 3;
      mirrors.splice(i,1);
    }
  });
}

// ------------------- GAME LOOP -------------------
function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#fff";
  ctx.font = "28px Arial";
  ctx.fillText("Game Over", 95, 300);
  ctx.font = "16px Arial";
  ctx.fillText("Refresh to try again", 95, 335);
}

function loop() {
  if (gameOver) {
    drawGameOver();
    return;
  }

  drawRiver();
  drawRocks();
  drawMirrors();
  drawBoard();

  updateObjects();
  checkCollisions();

  if (boostTimer > 0) {
    boostTimer--;
    if (boostTimer === 0) speed = baseSpeed;
  }

  score += speed * 0.1;
  document.getElementById("score").innerText = Math.floor(score);

  requestAnimationFrame(loop);
}

// ------------------- INPUT -------------------
canvas.addEventListener("touchmove", e => {
  const x = e.touches[0].clientX;
  boardX = Math.max(60, Math.min(canvas.width - 60, x));
});

// ------------------- SPAWN TIMERS -------------------
setInterval(spawnRock, 1000);
setInterval(spawnMirror, 4000);

loop();
</script>

</body>
</html>
