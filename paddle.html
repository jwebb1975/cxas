<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MightyPaddle – River Flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  overflow:hidden;
  background:#0a3d62;
  font-family:Arial, sans-serif;
}
canvas { display:block; margin:auto; }

.hud {
  position:fixed;
  top:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
  color:white;
  font-size:14px;
  z-index:10;
}

button {
  padding:14px 24px;
  font-size:18px;
  border:none;
  border-radius:12px;
  background:#f1c40f;
  color:#333;
}
</style>
</head>

<body>

<div class="hud">
  <div>⚡ <span id="energy">100</span></div>
  <div>🔋 <span id="battery">0</span></div>
  <div>🏁 <span id="distance">0</span> m</div>
</div>

<canvas id="game" width="360" height="640"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let boardX, boardY, velocity, energy, battery, distance;
let rocks=[], crocs=[], batteries=[];
let boost=false, gameOver=false;

function resetGame(){
  boardX = c.width/2;
  boardY = c.height * 0.48; // higher on screen
  velocity = 0;
  energy = 100;
  battery = 0;
  distance = 0;
  rocks=[]; crocs=[]; batteries=[];
  boost=false;
  gameOver=false;
}
resetGame();

// ---------- SPAWN ----------
setInterval(()=>!gameOver && rocks.push({x:randX(),y:-40,r:20}),1200);
setInterval(()=>!gameOver && crocs.push({x:randX(),y:-60,w:60,dir:Math.random()>0.5?1:-1}),2600);
setInterval(()=>!gameOver && batteries.push({x:randX(),y:-40}),5200);

function randX(){ return Math.random()*220+70; }

// ---------- DRAW ----------
function drawRiver(){
  const g = ctx.createLinearGradient(0,0,0,c.height);
  g.addColorStop(0,"#6ec6ff");
  g.addColorStop(1,"#0b4f6c");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,c.width,c.height);

  // flow lines
  ctx.strokeStyle="rgba(255,255,255,0.05)";
  for(let i=0;i<10;i++){
    ctx.beginPath();
    ctx.moveTo(60+i*30,0);
    ctx.lineTo(40+i*30,c.height);
    ctx.stroke();
  }

  // banks
  ctx.fillStyle="#1e8449";
  ctx.fillRect(0,0,50,c.height);
  ctx.fillRect(c.width-50,0,50,c.height);
}

function drawBoard(){
  ctx.save();
  ctx.translate(boardX,boardY);
  ctx.scale(boost?1.08:1, boost?1.08:1);

  // shadow
  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(0,48,16,7,0,0,Math.PI*2);
  ctx.fill();

  // board
  ctx.fillStyle=boost?"#fff3cd":"#ffffff";
  ctx.beginPath();
  ctx.moveTo(0,-55);
  ctx.quadraticCurveTo(26,0,16,70);
  ctx.lineTo(-16,70);
  ctx.quadraticCurveTo(-26,0,0,-55);
  ctx.fill();

  // stripe
  ctx.strokeStyle="#1e88e5";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(0,-50);
  ctx.lineTo(0,60);
  ctx.stroke();

  ctx.restore();
}

function drawRocks(){
  ctx.fillStyle="#555";
  rocks.forEach(o=>{
    ctx.beginPath();
    ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fill();
  });
}

function drawCrocs(){
  crocs.forEach(croc=>{
    croc.x += croc.dir*0.3;
    ctx.fillStyle="#2ecc71";
    ctx.fillRect(croc.x-30,croc.y-10,60,20);
    ctx.fillStyle="#145a32";
    ctx.fillRect(croc.x-25,croc.y-5,50,10);

    // eyes
    ctx.fillStyle="#fff";
    ctx.fillRect(croc.x-18,croc.y-12,6,6);
    ctx.fillRect(croc.x+12,croc.y-12,6,6);
  });
}

function drawBatteries(){
  batteries.forEach(b=>{
    ctx.fillStyle="#f1c40f";
    ctx.fillRect(b.x-10,b.y-20,20,40);
    ctx.fillStyle="#fff";
    ctx.fillRect(b.x-5,b.y-25,10,5);
  });
}

// ---------- GAME LOOP ----------
function loop(){
  if(gameOver){ drawGameOver(); return; }

  drawRiver();
  drawRocks();
  drawCrocs();
  drawBatteries();
  drawBoard();

  updateObjects();
  collisions();

  velocity += battery>0 ? 0.06 : -0.02;
  velocity = Math.max(0,Math.min(6,velocity));

  if(battery>0){
    battery -= boost?0.25:0.1;
    if(battery<0) battery=0;
  }

  distance += velocity;
  energy -= 0.02;
  if(energy<=0) gameOver=true;

  hud();
  requestAnimationFrame(loop);
}

function updateObjects(){
  rocks.forEach(o=>o.y+=velocity*2);
  crocs.forEach(o=>o.y+=velocity*2.2);
  batteries.forEach(o=>o.y+=velocity*2);

  rocks=rocks.filter(o=>o.y<c.height+60);
  crocs=crocs.filter(o=>o.y<c.height+60);
  batteries=batteries.filter(o=>o.y<c.height+60);
}

function collisions(){
  rocks.forEach(o=>{
    if(Math.abs(o.x-boardX)<25 && Math.abs(o.y-boardY)<40) gameOver=true;
  });
  crocs.forEach(o=>{
    if(Math.abs(o.x-boardX)<40 && Math.abs(o.y-boardY)<40){
      energy-=25;
      o.y+=120;
    }
  });
  batteries.forEach((o,i)=>{
    if(Math.abs(o.x-boardX)<30 && Math.abs(o.y-boardY)<40){
      battery+=120;
      batteries.splice(i,1);
    }
  });
}

function hud(){
  document.getElementById("energy").innerText=Math.floor(energy);
  document.getElementById("battery").innerText=Math.floor(battery);
  document.getElementById("distance").innerText=Math.floor(distance);
}

// ---------- GAME OVER ----------
function drawGameOver(){
  ctx.fillStyle="rgba(0,0,0,0.75)";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="#fff";
  ctx.font="26px Arial";
  ctx.fillText("River Run Ended",75,260);
  ctx.font="16px Arial";
  ctx.fillText(`Distance: ${Math.floor(distance)} m`,115,290);

  ctx.fillStyle="#f1c40f";
  ctx.fillRect(90,330,180,50);
  ctx.fillStyle="#333";
  ctx.font="18px Arial";
  ctx.fillText("START OVER",120,362);
}

// ---------- INPUT ----------
let startY=0, lastTap=0;

c.addEventListener("touchstart",e=>{
  const y=e.touches[0].clientY;
  startY=y;

  if(gameOver && y>330 && y<380){
    resetGame();
    loop();
  }

  const now=Date.now();
  if(now-lastTap<300){
    boost=true;
    setTimeout(()=>boost=false,600);
  }
  lastTap=now;
});

c.addEventListener("touchend",e=>{
  const endY=e.changedTouches[0].clientY;
  if(endY-startY>30){
    velocity+=0.9;
    energy=Math.min(100,energy+6);
  }
});

c.addEventListener("touchmove",e=>{
  boardX=Math.max(60,Math.min(c.width-60,e.touches[0].clientX));
});

loop();
</script>

</body>
</html>
