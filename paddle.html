<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MightyPaddle – River Flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; overflow:hidden; background:#0a3d62; font-family:Arial; }
canvas { display:block; margin:auto; }
.hud {
  position:fixed; top:10px; width:100%;
  display:flex; justify-content:space-around;
  color:white; font-size:14px;
}
</style>
</head>

<body>

<div class="hud">
  <div>⚡ Energy: <span id="energy">100</span></div>
  <div>🔋 Battery: <span id="battery">0</span></div>
  <div>🏁 <span id="distance">0</span> m</div>
</div>

<canvas id="game" width="360" height="640"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let boardX = c.width/2;
let boardY = c.height * 0.55;
let velocity = 0;
let energy = 100;
let battery = 0;
let distance = 0;
let boost = false;
let gameOver = false;

let rocks=[], crocs=[], batteries=[];

let lastTap = 0;

// ---------- SPAWN ----------
setInterval(()=>rocks.push({x:randX(),y:-40,r:20}),1200);
setInterval(()=>crocs.push({x:randX(),y:-60,w:50} ),2500);
setInterval(()=>batteries.push({x:randX(),y:-40}),5000);

function randX(){ return Math.random()*220+70; }

// ---------- DRAW ----------
function river(){
  const g=ctx.createLinearGradient(0,0,0,c.height);
  g.addColorStop(0,"#5dade2");
  g.addColorStop(1,"#1b4f72");
  ctx.fillStyle=g; ctx.fillRect(0,0,c.width,c.height);

  ctx.fillStyle="#1e8449";
  ctx.fillRect(0,0,50,c.height);
  ctx.fillRect(c.width-50,0,50,c.height);
}

function board(){
  ctx.save();
  ctx.translate(boardX,boardY);
  ctx.scale(boost?1.05:1, boost?1.05:1);

  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.beginPath(); ctx.ellipse(0,45,14,6,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle="#fdfefe";
  ctx.beginPath();
  ctx.moveTo(0,-50);
  ctx.quadraticCurveTo(22,0,14,60);
  ctx.lineTo(-14,60);
  ctx.quadraticCurveTo(-22,0,0,-50);
  ctx.fill();

  ctx.restore();
}

function drawRocks(){
  ctx.fillStyle="#555";
  rocks.forEach(o=>{
    ctx.beginPath();
    ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fill();
  });
}

function drawCrocs(){
  ctx.fillStyle="#2ecc71";
  crocs.forEach(c=>{
    ctx.fillRect(c.x-25,c.y-10,50,20);
    ctx.fillStyle="#27ae60";
  });
}

function drawBatteries(){
  batteries.forEach(b=>{
    ctx.fillStyle="#f1c40f";
    ctx.fillRect(b.x-10,b.y-20,20,40);
  });
}

// ---------- UPDATE ----------
function update(){
  if(gameOver){ end(); return; }

  river();

  velocity += battery>0 ? 0.08 : -0.02;
  velocity = Math.max(0, Math.min(6, velocity));

  if(battery>0){
    battery -= boost?0.3:0.1;
    if(battery<0) battery=0;
  }

  rocks.forEach(o=>o.y+=velocity*2);
  crocs.forEach(o=>o.y+=velocity*2.2);
  batteries.forEach(o=>o.y+=velocity*2);

  collision();
  cleanup();

  drawRocks(); drawCrocs(); drawBatteries(); board();

  distance += velocity;
  energy = Math.max(0,energy-0.02);
  if(energy<=0) gameOver=true;

  hud();
  requestAnimationFrame(update);
}

function collision(){
  rocks.forEach(o=>{
    if(Math.abs(o.x-boardX)<25 && Math.abs(o.y-boardY)<40) gameOver=true;
  });

  crocs.forEach(o=>{
    if(Math.abs(o.x-boardX)<35 && Math.abs(o.y-boardY)<40){
      energy-=20; o.y+=100;
    }
  });

  batteries.forEach((o,i)=>{
    if(Math.abs(o.x-boardX)<30 && Math.abs(o.y-boardY)<40){
      battery+=100; batteries.splice(i,1);
    }
  });
}

function cleanup(){
  rocks=rocks.filter(o=>o.y<c.height+60);
  crocs=crocs.filter(o=>o.y<c.height+60);
  batteries=batteries.filter(o=>o.y<c.height+60);
}

function hud(){
  energy=Math.floor(energy);
  document.getElementById("energy").innerText=energy;
  document.getElementById("battery").innerText=Math.floor(battery);
  document.getElementById("distance").innerText=Math.floor(distance);
}

function end(){
  ctx.fillStyle="rgba(0,0,0,0.7)";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="#fff";
  ctx.font="26px Arial";
  ctx.fillText("River Ended",90,300);
  ctx.font="14px Arial";
  ctx.fillText("Refresh to paddle again",90,330);
}

// ---------- INPUT ----------
let startY=0;
c.addEventListener("touchstart",e=>{
  startY=e.touches[0].clientY;

  let now=Date.now();
  if(now-lastTap<300){
    boost=true;
    setTimeout(()=>boost=false,600);
  }
  lastTap=now;
});

c.addEventListener("touchend",e=>{
  let endY=e.changedTouches[0].clientY;
  if(endY-startY>30){
    velocity+=0.8;
    energy=Math.min(100,energy+5);
  }
});

c.addEventListener("touchmove",e=>{
  boardX=Math.max(60,Math.min(c.width-60,e.touches[0].clientX));
});

update();
</script>

</body>
</html>
