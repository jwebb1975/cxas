      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, .25);
      transform: translateY(110%);
      opacity: 0;
      transition: all .4s ease;
    }
    .bottom-nav.show {

  <!-- Bottom Dock -->
  <div class="bottom-nav" id="bottomNav">
    <span id="hitCounter">Hits: 0</span>
    <span class="dot">•</span>
    <span id="liveClock">--:--:--</span>
  </div>

  <script>
    (function () {
      const hitEl = document.getElementById('hitCounter');
      const hits = Number(localStorage.getItem('pageHits') || 0) + 1;
      localStorage.setItem('pageHits', hits);
      hitEl.textContent = `Hits: ${hits}`;

      const clkEl = document.getElementById('liveClock');
      function tick() {
        const now = new Date();
        clkEl.textContent = now.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      }
      tick();
      setInterval(tick, 1000);

      requestAnimationFrame(() =>
        document.getElementById('bottomNav').classList.add('show')
      );
    })();
  </script>
