<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DEMO Landing Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 20px 20px 140px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #efefef;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    /* App icons */
    .icon {
      width: 90px;
      height: 90px;
      background: linear-gradient(to bottom, #ffffff, #e0e0e0);
      border-radius: 22px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #222;
      font-size: 12px;
      padding: 8px;
      transition: transform .1s ease-in-out;
    }
    .icon:hover { transform: translateY(-2px); }
    .icon:active { transform: scale(.95); }

    .icon img {
      width: 42px;
      height: 42px;
      margin-bottom: 6px;
    }

    .label {
      text-align: center;
      line-height: 1.1;
    }

    /* Bottom dock */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e1e1f;
      color: #fff;
      padding: 10px 14px;
      font-size: 13px;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      box-shadow: 0 -4px 12px rgba(0, 0, 0, .35);
      transform: translateY(110%);
      opacity: 0;
      transition: all .4s ease;
      z-index: 999;
    }
    .bottom-nav.show {
      transform: translateY(0);
      opacity: 1;
    }

    .dock-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .dot {
      color: #6ea0ff;
      margin: 0 8px;
    }

    /* Analytics panels */
    .analytics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .panel {
      background: #2b2b2d;
      border-radius: 10px;
      padding: 10px;
      max-height: 160px;
      overflow: auto;
      font-size: 12px;
    }

    .panel h4 {
      margin: 0 0 6px;
      font-size: 12px;
      color: #9ecbff;
      font-weight: 600;
    }

    canvas {
      width: 100%;
      height: 120px;
      background: #111;
      border-radius: 8px;
    }

    .ip-entry {
      font-family: monospace;
      color: #d4d4d4;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

<!-- Icons (topic-specific) -->
<a class="icon" href="index.html" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/1828/1828911.png">
  <span class="label">Login</span>
</a>

<a class="icon" href="networkassessment.html" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/3212/3212608.png">
  <span class="label">Network<br>Assessment</span>
</a>

<a class="icon" href="topology.html" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/1011/1011886.png">
  <span class="label">Topology</span>
</a>

<a class="icon" href="main6.html" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/2620/2620555.png">
  <span class="label">Main Demo</span>
</a>

<a class="icon" href="demohub.html" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/2917/2917990.png">
  <span class="label">Demo Hub</span>
</a>

<a class="icon" href="https://www.cxsol.com/demo/aibootcamp3.html" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/5776/5776795.png">
  <span class="label">AI Bootcamp</span>
</a>

<a class="icon" href="sendEmail.html" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png">
  <span class="label">Send Email</span>
</a>

<a class="icon" href="sendSMS.html" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/88/88144.png">
  <span class="label">Send SMS</span>
</a>

<a class="icon" href="https://cxsol.com/contact" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/1828/1828765.png">
  <span class="label">Contact Us</span>
</a>

<!-- Bottom Analytics Dock -->
<div class="bottom-nav" id="bottomNav">
  <div class="dock-top">
    <span id="hitCounter">Hits: 0</span>
    <span class="dot">•</span>
    <span id="liveClock">--:--:--</span>
  </div>

  <div class="analytics">
    <div class="panel">
      <h4>Visits Over Time</h4>
      <canvas id="hitChart"></canvas>
    </div>

    <div class="panel">
      <h4>Visitor IP Log</h4>
      <div id="ipLog"></div>
    </div>
  </div>
</div>

<script>
(function () {
  /* ===== HIT COUNTER ===== */
  const hits = Number(localStorage.getItem('pageHits') || 0) + 1;
  localStorage.setItem('pageHits', hits);
  document.getElementById('hitCounter').textContent = `Hits: ${hits}`;

  /* ===== TIME ===== */
  function tick() {
    document.getElementById('liveClock').textContent =
      new Date().toLocaleTimeString();
  }
  tick();
  setInterval(tick, 1000);

  /* ===== HIT HISTORY ===== */
  const hitHistory = JSON.parse(localStorage.getItem('hitHistory') || '[]');
  hitHistory.push(Date.now());
  localStorage.setItem('hitHistory', JSON.stringify(hitHistory.slice(-50)));

  /* ===== DRAW GRAPH ===== */
  const canvas = document.getElementById('hitChart');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#6ea0ff';
  ctx.lineWidth = 2;
  ctx.beginPath();

  hitHistory.slice(-20).forEach((_, i, arr) => {
    const x = (i / (arr.length - 1 || 1)) * canvas.width;
    const y = canvas.height - (i / arr.length) * canvas.height;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  /* ===== IP LOGGER ===== */
  fetch('https://api.ipify.org?format=json')
    .then(res => res.json())
    .then(data => {
      const ipHistory = JSON.parse(localStorage.getItem('ipHistory') || '[]');
      ipHistory.unshift({
        ip: data.ip,
        time: new Date().toLocaleString()
      });
      localStorage.setItem('ipHistory', JSON.stringify(ipHistory.slice(0, 30)));

      const log = document.getElementById('ipLog');
      log.innerHTML = ipHistory
        .map(e => `<div class="ip-entry">${e.time} — ${e.ip}</div>`)
        .join('');
    });

  /* ===== SHOW DOCK ===== */
  requestAnimationFrame(() =>
    document.getElementById('bottomNav').classList.add('show')
  );
})();
</script>

</body>
</html>
