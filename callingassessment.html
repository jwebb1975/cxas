<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Webex Calling Assessment</title>
  <style>
    :root{
      --bg:#0b1020; --panel:#121a33; --panel2:#0f1730; --text:#e8ecff; --muted:#aeb8e6;
      --border:#25305d; --accent:#6ea8fe; --danger:#ff5c7a; --ok:#43d19e; --warn:#ffcc66;
      --shadow:0 10px 30px rgba(0,0,0,.35); --radius:14px;
      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans";
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:var(--sans); color:var(--text);
      background: radial-gradient(1200px 800px at 20% 10%, #1a2a6f 0%, var(--bg) 55%);
    }
    header{
      position:sticky; top:0; z-index:10;
      background:rgba(11,16,32,.78); backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .wrap{max-width:1150px; margin:0 auto; padding:16px}
    .head{
      display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    }
    h1{margin:0; font-size:20px}
    .sub{margin:6px 0 0; color:var(--muted); font-size:13px}
    .btnbar{display:flex; gap:10px; flex-wrap:wrap}
    button{
      border:1px solid rgba(255,255,255,.10);
      background:#16224a; color:var(--text);
      padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:700;
    }
    button:hover{border-color:rgba(255,255,255,.18)}
    .primary{background:linear-gradient(90deg,#2b69ff,#6ea8fe); border-color:transparent}
    .secondary{background:#0d1636}
    .danger{background:rgba(255,92,122,.12); border-color:rgba(255,92,122,.35); color:#ffdbe2}
    main{max-width:1150px; margin:0 auto; padding:16px}
    .card{
      background:linear-gradient(180deg, rgba(18,26,51,.95), rgba(15,23,48,.95));
      border:1px solid rgba(255,255,255,.06);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px; margin:16px 0;
    }
    .card h2{margin:0 0 12px; font-size:16px}
    .grid{display:grid; gap:12px}
    .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
    @media (max-width:900px){.grid2{grid-template-columns:1fr}}
    label{display:block; font-size:12px; color:var(--muted); margin:0 0 6px}
    input, textarea, select{
      width:100%; border-radius:10px; border:1px solid rgba(255,255,255,.08);
      background:#0b122a; color:var(--text); padding:10px 12px; outline:none;
    }
    textarea{resize:vertical}
    .help{display:block; font-size:11px; color:rgba(174,184,230,.9); margin-top:6px}
    .status{
      margin-top:12px; padding:10px 12px; border-radius:10px;
      border:1px solid rgba(255,255,255,.06); background:rgba(0,0,0,.18);
      color:var(--muted); display:none;
    }
    .ok{display:block; border-color:rgba(67,209,158,.35); color:#bff3df}
    .warn{display:block; border-color:rgba(255,204,102,.35); color:#ffe5b5}
    .err{display:block; border-color:rgba(255,92,122,.35); color:#ffdbe2}
    .accordion{display:flex; flex-direction:column; gap:10px}
    .section{
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px; overflow:hidden; background:rgba(0,0,0,.10);
    }
    .secHead{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:12px; cursor:pointer; user-select:none;
    }
    .secTitle{font-weight:800}
    .secMeta{color:var(--muted); font-size:12px}
    .secBody{display:none; padding:12px; border-top:1px solid rgba(255,255,255,.06)}
    .open .secBody{display:block}
    table{width:100%; border-collapse:separate; border-spacing:0}
    th,td{vertical-align:top; border-bottom:1px solid rgba(255,255,255,.06); padding:10px}
    th{text-align:left; color:var(--muted); font-size:12px; font-weight:800}
    .qcol{width:52%} .acol{width:48%}
    .json{
      font-family:var(--mono); font-size:12px;
      background:#080d1e; border:1px solid rgba(255,255,255,.06);
      border-radius:12px; padding:14px; overflow:auto; max-height:520px;
    }
  </style>
</head>
<body>
<header>
  <div class="wrap head">
    <div>
      <h1>Webex Calling Assessment</h1>
      <div class="sub">Comprehensive assessment form. Submit to a webhook and capture structured JSON.</div>
    </div>
    <div class="btnbar">
      <button class="secondary" id="expandAll">Expand all</button>
      <button class="secondary" id="collapseAll">Collapse all</button>
      <button class="danger" id="clearAll">Clear</button>
    </div>
  </div>
</header>

<main>
  <section class="card">
    <h2>Webhook & Metadata</h2>
    <div class="grid grid2">
      <div>
        <label for="webhookUrl">Webhook URL</label>
        <input id="webhookUrl" type="url" placeholder="https://your-webhook.example/endpoint" />
        <span class="help">On Submit, the form POSTs JSON to this URL (Content-Type: application/json).</span>
      </div>
      <div>
        <label for="templateId">Template ID</label>
        <input id="templateId" type="text" value="wxc-assessment-v1" />
      </div>

      <div>
        <label for="customerName">Customer Name</label>
        <input id="customerName" type="text" placeholder="Customer legal name" />
      </div>
      <div>
        <label for="opportunityId">Opportunity / Deal ID</label>
        <input id="opportunityId" type="text" placeholder="e.g., SFDC Opp ID" />
      </div>

      <div>
        <label for="projectName">Project Name</label>
        <input id="projectName" type="text" placeholder="e.g., Webex Calling Migration" />
      </div>
      <div>
        <label for="targetGoLive">Target Go-Live Date</label>
        <input id="targetGoLive" type="date" />
      </div>

      <div>
        <label for="preparedBy">Prepared By</label>
        <input id="preparedBy" type="text" placeholder="Name / email" />
      </div>
      <div>
        <label for="notes">General Notes</label>
        <textarea id="notes" rows="3" placeholder="Any global notes..."></textarea>
      </div>
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px">
      <button class="secondary" id="validateBtn">Validate</button>
      <button class="secondary" id="copyBtn">Copy JSON</button>
      <button class="secondary" id="downloadBtn">Download JSON</button>
      <button class="primary" id="submitBtn">Submit to Webhook</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <section class="card">
    <h2>Assessment Form</h2>
    <div id="formRoot" class="accordion"></div>
  </section>

  <section class="card">
    <h2>JSON Payload Preview (what submits)</h2>
    <pre id="jsonPreview" class="json">{}</pre>
  </section>
</main>

<script>
/** =============================
 *  Webex Calling Assessment Form
 *  - Single-file HTML: no build tools
 *  - Saves answers in localStorage
 *  - Submits structured JSON to webhook
 *  ============================= */

function isoNow(){ return new Date().toISOString(); }

function setStatus(kind, msg){
  const el = document.getElementById("status");
  el.className = "status " + (kind || "");
  el.textContent = msg;
  el.style.display = "block";
}
function clearStatus(){
  const el = document.getElementById("status");
  el.style.display = "none";
  el.textContent = "";
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    return null;
  }
}

function baseMeta(){
  return {
    customerName: document.getElementById("customerName").value || "",
    opportunityId: document.getElementById("opportunityId").value || "",
    projectName: document.getElementById("projectName").value || "",
    targetGoLive: document.getElementById("targetGoLive").value || "",
    preparedBy: document.getElementById("preparedBy").value || "",
    notes: document.getElementById("notes").value || ""
  };
}

function buildEmptyPayload(){
  const templateId = document.getElementById("templateId").value || "wxc-assessment-v1";
  const payload = {
    schemaVersion: "1.0",
    templateId,
    meta: { ...baseMeta(), createdAt: isoNow(), updatedAt: isoNow() },
    sections: {}
  };
  for(const s of SECTIONS){
    payload.sections[s.id] = { title: s.title, responses: {} };
    for(const q of s.questions){
      payload.sections[s.id].responses[q.id] = "";
    }
  }
  return payload;
}

function ensureKeys(payload){
  for(const s of SECTIONS){
    if(!payload.sections[s.id]) payload.sections[s.id] = { title: s.title, responses: {} };
    payload.sections[s.id].title = s.title;
    if(!payload.sections[s.id].responses) payload.sections[s.id].responses = {};
    for(const q of s.questions){
      if(typeof payload.sections[s.id].responses[q.id] !== "string") payload.sections[s.id].responses[q.id] = "";
    }
  }
}

function renderForm(payload){
  const root = document.getElementById("formRoot");
  root.innerHTML = "";

  for(const s of SECTIONS){
    const sec = document.createElement("div");
    sec.className = "section open";

    const head = document.createElement("div");
    head.className = "secHead";
    head.innerHTML = `
      <div>
        <div class="secTitle">${s.title}</div>
        <div class="secMeta">${s.questions.length} questions</div>
      </div>
      <div class="secMeta">Click to toggle</div>
    `;
    head.addEventListener("click", () => sec.classList.toggle("open"));

    const body = document.createElement("div");
    body.className = "secBody";

    const table = document.createElement("table");
    table.innerHTML = `
      <thead><tr><th class="qcol">Question</th><th class="acol">Answer</th></tr></thead>
    `;
    const tb = document.createElement("tbody");

    for(const q of s.questions){
      const tr = document.createElement("tr");
      const tdQ = document.createElement("td");
      tdQ.className = "qcol";
      tdQ.textContent = q.label;

      const tdA = document.createElement("td");
      tdA.className = "acol";

      const current = payload.sections[s.id].responses[q.id] || "";
      let input;

      if(q.type === "textarea"){
        input = document.createElement("textarea");
        input.rows = 3;
        input.value = current;
      }else if(q.type === "select"){
        input = document.createElement("select");
        for(const opt of q.options){
          const o = document.createElement("option");
          o.value = opt;
          o.textContent = opt === "" ? "— Select —" : opt;
          input.appendChild(o);
        }
        input.value = current;
      }else{
        input = document.createElement("input");
        input.type = "text";
        input.value = current;
      }

      input.dataset.sectionId = s.id;
      input.dataset.questionId = q.id;

      input.addEventListener("input", () => {
        payload.sections[s.id].responses[q.id] = input.value;
        payload.meta = { ...payload.meta, ...baseMeta(), updatedAt: isoNow() };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        updatePreview(payload);
        clearStatus();
      });

      tdA.appendChild(input);
      tr.appendChild(tdQ);
      tr.appendChild(tdA);
      tb.appendChild(tr);
    }

    table.appendChild(tb);
    body.appendChild(table);

    sec.appendChild(head);
    sec.appendChild(body);
    root.appendChild(sec);
  }
}

function updatePreview(payload){
  document.getElementById("jsonPreview").textContent = JSON.stringify(payload, null, 2);
}

function hydrateMeta(payload){
  const m = payload.meta || {};
  document.getElementById("templateId").value = payload.templateId || "wxc-assessment-v1";
  document.getElementById("customerName").value = m.customerName || "";
  document.getElementById("opportunityId").value = m.opportunityId || "";
  document.getElementById("projectName").value = m.projectName || "";
  document.getElementById("targetGoLive").value = m.targetGoLive || "";
  document.getElementById("preparedBy").value = m.preparedBy || "";
  document.getElementById("notes").value = m.notes || "";
}

function wireMeta(payload){
  const ids = ["templateId","customerName","opportunityId","projectName","targetGoLive","preparedBy","notes"];
  ids.forEach(id => {
    document.getElementById(id).addEventListener("input", () => {
      payload.templateId = document.getElementById("templateId").value || "wxc-assessment-v1";
      payload.meta = { ...payload.meta, ...baseMeta(), updatedAt: isoNow() };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      updatePreview(payload);
      clearStatus();
    });
  });
}

function validate(payload){
  const warnings = [];
  if(!payload.meta.customerName) warnings.push("Customer Name is empty.");
  if(!payload.meta.projectName) warnings.push("Project Name is empty.");
  let answered = 0, total = 0;
  for(const s of SECTIONS){
    for(const q of s.questions){
      total++;
      const v = (payload.sections[s.id].responses[q.id] || "").trim();
      if(v) answered++;
    }
  }
  if(answered === 0) warnings.push("No answers entered yet.");
  return { warnings, answered, total };
}

async function submitWebhook(payload){
  const url = (document.getElementById("webhookUrl").value || "").trim();
  if(!url){
    setStatus("err", "Webhook URL is empty. Add a webhook URL first.");
    return;
  }
  payload.templateId = document.getElementById("templateId").value || payload.templateId || "wxc-assessment-v1";
  payload.meta = { ...payload.meta, ...baseMeta(), updatedAt: isoNow() };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  updatePreview(payload);

  try{
    const res = await fetch(url, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });
    const text = await res.text().catch(()=> "");
    if(!res.ok){
      setStatus("err", `Webhook POST failed (${res.status}). ${text ? "Response: " + text : ""}`);
      return;
    }
    setStatus("ok", `Webhook POST successful (${res.status}).`);
  }catch(e){
    setStatus("err", "Webhook POST failed (network/CORS). If using GitHub Pages, your webhook must allow CORS.");
  }
}

function downloadJSON(payload){
  payload.templateId = document.getElementById("templateId").value || payload.templateId || "wxc-assessment-v1";
  payload.meta = { ...payload.meta, ...baseMeta(), updatedAt: isoNow() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const name = (payload.meta.customerName || "customer").replace(/[^\w\-]+/g,"_");
  a.href = url;
  a.download = `${name}_wxc_assessment.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function copyJSON(payload){
  payload.templateId = document.getElementById("templateId").value || payload.templateId || "wxc-assessment-v1";
  payload.meta = { ...payload.meta, ...baseMeta(), updatedAt: isoNow() };
  await navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
  setStatus("ok", "JSON copied to clipboard.");
}

function setExpand(open){
  document.querySelectorAll(".section").forEach(sec => sec.classList.toggle("open", open));
}

function init(){
  let payload = loadState();
  if(!payload) payload = buildEmptyPayload();
  if(!payload.sections) payload.sections = {};
  ensureKeys(payload);
  hydrateMeta(payload);
  renderForm(payload);
  wireMeta(payload);
  updatePreview(payload);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));

  document.getElementById("expandAll").addEventListener("click", ()=> setExpand(true));
  document.getElementById("collapseAll").addEventListener("click", ()=> setExpand(false));

  document.getElementById("validateBtn").addEventListener("click", ()=>{
    const {warnings, answered, total} = validate(payload);
    if(warnings.length) setStatus("warn", `Validation warnings: ${warnings.join(" ")} (Answered: ${answered}/${total})`);
    else setStatus("ok", `Validation passed. (Answered: ${answered}/${total})`);
  });

  document.getElementById("submitBtn").addEventListener("click", ()=> submitWebhook(payload));
  document.getElementById("downloadBtn").addEventListener("click", ()=> downloadJSON(payload));
  document.getElementById("copyBtn").addEventListener("click", ()=> copyJSON(payload));

  document.getElementById("clearAll").addEventListener("click", ()=>{
    if(!confirm("Clear all saved answers? This cannot be undone.")) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
