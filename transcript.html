<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Transcript Word Cloud Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
    body {
        background: #0f0f11;
        color: #fff;
        font-family: Arial, sans-serif;
        padding: 20px;
    }
    h1 {
        text-align: center;
        color: #00eaff;
        margin-bottom: 20px;
    }
    #searchBox {
        width: 300px;
        padding: 10px;
        font-size: 18px;
    }
    #container {
        margin-top: 20px;
        text-align: center;
    }
    #wordCloud svg {
        margin: auto;
        display: block;
    }
    .resultBox {
        margin-top: 30px;
        padding: 20px;
        background: #1a1d20;
        border-radius: 10px;
        border: 1px solid #00eaff;
    }
    .interactionLabel {
        color: #ffcc00;
        font-weight: bold;
    }
</style>
</head>
<body>

<h1>Conversation Word Cloud Analyzer</h1>

<input id="searchBox" type="text" placeholder="Enter word…">
<button onclick="searchWord()">Search</button>

<div id="container">
    <div id="wordCloud"></div>
    <div id="results" class="resultBox"></div>
</div>

<script>
const API_URL = "https://659f21365023b02bfe894b27.mockapi.io/cx/callTranscriptions";

let interactionData = {};  // { interactionId: "full transcript text" }
let allWords = {};         // Combined word frequencies

async function loadData() {
    const response = await fetch(API_URL);
    const raw = await response.json();

    raw.forEach(call => {
        const id = call.interactionId;
        let combinedTranscript = "";

        call.responseContents.forEach(segment => {
            const alt = segment?.recognitionResult?.alternatives?.[0];
            if (alt && alt.transcript) {
                combinedTranscript += " " + alt.transcript;
            }
        });

        interactionData[id] = combinedTranscript.trim();
    });

    buildWordCloud();
}

function buildWordCloud() {
    allWords = {};

    Object.values(interactionData).forEach(text => {
        text.split(/\s+/).forEach(word => {
            const clean = word.toLowerCase().replace(/[^a-z0-9]/g, "");
            if (!clean) return;
            allWords[clean] = (allWords[clean] || 0) + 1;
        });
    });

    renderCloud(allWords);
}

function renderCloud(words) {
    document.getElementById("wordCloud").innerHTML = "";

    const entries = Object.entries(words).map(([text, count]) => ({
        text, size: 10 + count * 8
    }));

    const layout = d3.layout.cloud()
        .size([900, 500])
        .words(entries)
        .padding(5)
        .rotate(() => ~~(Math.random() * 2) * 90)
        .font("Arial")
        .fontSize(d => d.size)
        .on("end", draw);

    layout.start();

    function draw(words) {
        d3.select("#wordCloud")
            .append("svg")
            .attr("width", 900)
            .attr("height", 500)
            .append("g")
            .attr("transform", "translate(450,250)")
            .selectAll("text")
            .data(words)
            .enter().append("text")
            .style("font-size", d => d.size + "px")
            .style("fill", "#00eaff")
            .attr("text-anchor", "middle")
            .attr("transform", d => `translate(${d.x},${d.y}) rotate(${d.rotate})`)
            .text(d => d.text)
            .style("cursor", "pointer")
            .on("click", d => showWordDetails(d.text));
    }
}

function searchWord() {
    const word = document.getElementById("searchBox").value.toLowerCase();
    showWordDetails(word);
}

function showWordDetails(word) {
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";

    if (!word) return;

    let html = `<h2>Search Results for "<span style='color:#00eaff'>${word}</span>"</h2>`;

    Object.entries(interactionData).forEach(([id, transcript]) => {
        const regex = new RegExp("\\b" + word + "\\b", "gi");
        const matches = transcript.match(regex);

        if (matches && matches.length > 0) {
            html += `
                <p>
                    <span class="interactionLabel">Interaction ID:</span> ${id}<br>
                    Count: <strong>${matches.length}</strong><br>
                    <em>Excerpt:</em> ${highlightWord(transcript, word)}
                </p>
                <hr />
            `;
        }
    });

    resultsDiv.innerHTML = html;
}

function highlightWord(text, word) {
    const regex = new RegExp(`(${word})`, "gi");
    return text.replace(regex, `<span style="color:#ff0066; font-weight:bold;">$1</span>`);
}

loadData();
</script>
</body>
</html>
