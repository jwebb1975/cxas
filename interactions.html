<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Conversation Intelligence</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.15);
      --accent: linear-gradient(135deg,#38bdf8,#6366f1);
      --customer: #38bdf8;
      --agent: #4ade80;
      --text: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, #020617);
      color: var(--text);
      padding: 30px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 6px;
      background: var(--accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub {
      opacity: 0.8;
      margin-bottom: 25px;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
    }

    button {
      padding: 14px 22px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .results {
      display: grid;
      gap: 12px;
      margin-bottom: 30px;
    }

    .result {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .result:hover {
      transform: scale(1.01);
      background: rgba(255,255,255,0.12);
    }

    .clouds {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .cloudBox {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .cloudTitle {
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    canvas {
      width: 100%;
      height: 260px;
    }

    .conversation {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 70%;
      padding: 14px;
      border-radius: 14px;
      line-height: 1.4;
    }

    .customer {
      align-self: flex-start;
      background: rgba(56,189,248,0.15);
      border-left: 4px solid var(--customer);
    }

    .agent {
      align-self: flex-end;
      background: rgba(74,222,128,0.15);
      border-right: 4px solid var(--agent);
    }

    .icon {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

<h1>Conversation Intelligence</h1>
<div class="sub">Search, analyze, and visualize customer–agent conversations</div>

<div class="search-bar">
  <input id="search" placeholder="Search ANI, Task ID, or keyword">
  <button onclick="search()">Search</button>
</div>

<div class="results" id="results"></div>

<div class="clouds">
  <div class="cloudBox">
    <div class="cloudTitle">👤 Customer Word Cloud</div>
    <canvas id="cloudCustomer"></canvas>
  </div>
  <div class="cloudBox">
    <div class="cloudTitle">🎧 Agent Word Cloud</div>
    <canvas id="cloudAgent"></canvas>
  </div>
</div>

<div class="conversation" id="conversation"></div>

<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>

<script>
/* Demo data (same structure as MockAPI) */
const interactions = [
  {
    taskId: "e890a591-63f0-4984-a8f2-00e631368fb4",
    ani: "+12125551212",
    messages: [
      { speaker: "Customer", text: "Hi I need help with my order" },
      { speaker: "Agent", text: "Sure I can help you with that" },
      { speaker: "Customer", text: "It has not arrived yet" },
      { speaker: "Agent", text: "Let me check the shipping status" }
    ],
    wordFrequency: {
      customer: { help: 1, order: 1, arrived: 1 },
      agent: { help: 1, shipping: 1 }
    }
  }
];

function search() {
  const q = document.getElementById("search").value.toLowerCase();
  const r = document.getElementById("results");
  r.innerHTML = "";

  interactions
    .filter(i => i.taskId.includes(q) || i.ani.includes(q) || JSON.stringify(i.wordFrequency).includes(q))
    .forEach(i => {
      const div = document.createElement("div");
      div.className = "result";
      div.innerHTML = `<strong>${i.ani}</strong><br>${i.taskId}`;
      div.onclick = () => renderInteraction(i);
      r.appendChild(div);
    });
}

function renderInteraction(i) {
  renderCloud("cloudCustomer", i.wordFrequency.customer);
  renderCloud("cloudAgent", i.wordFrequency.agent);
  renderConversation(i.messages);
}

function renderCloud(id, freq) {
  WordCloud(document.getElementById(id), {
    list: Object.entries(freq),
    weightFactor: 14,
    gridSize: 8,
    color: "random-light",
    backgroundColor: "transparent"
  });
}

function renderConversation(messages) {
  const c = document.getElementById("conversation");
  c.innerHTML = "";

  messages.forEach(m => {
    const div = document.createElement("div");
    div.className = `bubble ${m.speaker === "Agent" ? "agent" : "customer"}`;
    div.innerHTML = `
      <div class="icon">${m.speaker === "Agent" ? "🎧 Agent" : "👤 Customer"}</div>
      ${m.text}
    `;
    c.appendChild(div);
  });
}
</script>

</body>
</html>
