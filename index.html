<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CXAS 2FA DEMO Page</title>
  <style>
    body{
      font-family:Arial, sans-serif;display:flex;justify-content:center;
      align-items:center;height:100vh;margin:0;background:#f3f3f3;
    }
    .card{
      background:#fff;padding:24px 32px;border-radius:8px;
      box-shadow:0 4px 12px rgba(0,0,0,.1);width:320px;text-align:center;
    }
    .logo{width:208px;height:47px;margin-bottom:16px}
    label{display:block;margin:12px 0 4px;font-weight:bold;text-align:left}
    input{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
    button{width:100%;margin-top:16px;padding:10px;border:none;border-radius:4px;
      background:#006aff;color:#fff;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .message{margin-top:12px;font-size:14px;color:green}
  </style>
</head>
<body>
  <div class="card">
    <img class="logo"
         src="https://cxsol.com/wp-content/uploads/2024/01/CX-Advanced-Solutions-header-208x47.png"
         alt="CX Advanced Solutions Logo">
    <h2>Login Form</h2>

    <form id="resetForm">
      <label for="username">Username</label>
      <input id="username" type="text" required>

      <label for="password">New Password</label>
      <input id="password" type="password" required>

      <button id="submitBtn" type="submit">Submit</button>
      <div id="messageBox" class="message"></div>
    </form>
  </div>

  <script>
    const webhookUrl = "https://hooks.us.webexconnect.io/events/SGFUZUKWXV"; // replace with your endpoint

    document.getElementById("resetForm").addEventListener("submit", async e => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const msg = document.getElementById("messageBox");
      btn.disabled = true;
      btn.textContent = "Sending…";

      try {
        const res = await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            action: "request_2fa"
          })
        });
        if (!res.ok) throw new Error("Server error");

        msg.textContent = "2FA code sent. Redirecting…";
        setTimeout(() => window.location.href = "verify.html", 1000);
      } catch (err) {
        msg.textContent = "Error: " + err.message;
        msg.style.color = "red";
        btn.disabled = false;
        btn.textContent = "Submit";
      }
    });
  </script>
